<!DOCTYPE html>
<html>
<head>
    <title>Facebook Style Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header -->
    <div class="header">
        facebook
        <div class="nav">
            <div class="nav-item">Home</div>
            <div class="nav-item">Profile</div>
            <div class="nav-item">Messages</div>
            <div class="nav-item">Logout</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Left Sidebar -->
        <div class="sidebar">
            <div class="side-item">News Feed</div>
            <div class="side-item">Friends</div>
            <div class="side-item">Groups</div>
            <div class="side-item">Marketplace</div>
            <div class="side-item">Watch</div>
        </div>

        <!-- Feed Section -->
        <div class="feed">

            <div class="status-box">
                What's on your mind?
                <div class="btn">Post</div>
            </div>

            <div class="post">
                <div class="username">Amit Kumar</div>
                <div class="content">wants new Friends</div>
                <div class="actions">
                    <div class="btn small">Like</div>
                    <div class="btn small">Comment</div>
                    <div class="btn small">Share</div>
                </div>
            </div>

            <div class="post">
                <div class="username">Piyush Kochar</div>
                <div class="content">I am new here! </div>
                <div class="actions">
                    <div class="btn small">Like</div>
                    <div class="btn small">Comment</div>
                    <div class="btn small">Share</div>
                </div>
            </div>

        </div>

        <!-- Right Sidebar -->
        <div class="rightbar">
            <div class="right-title">Suggestions</div>
            <div class="right-item">Follow Web Dev</div>
            <div class="right-item">Follow CSS Tips</div>
            <div class="right-item">Follow HTML World</div>
            <div class="btn">See More</div>
        </div>

    </div>


</body>
</html>
